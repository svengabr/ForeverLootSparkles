<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forever Loot Sparkles – Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame"></div>

<div class="copy" style="gap: 30px;">
  <img src="../logo.png" alt="" style="width: 150px; height: 150px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6));">
  <h1 style="font-size: 92px; color: var(--gold);">Forever<br>Loot Sparkles</h1>
  <p style="font-family: 'Friz', serif; font-size: 40px; color: #fff;">Never walk past a quest item again.</p>
  <p>Keeps the sparkle on lootable quest items on, even after a graphics preset turns it off.</p>
  <p class="note">For World of Warcraft: Forever</p>
</div>
<div class="stage">
  <div style="width: 860px; display: flex; flex-direction: column; gap: 34px;">
    <div class="shot"><img src="shot-off.png" alt=""><span class="label">Off</span></div>
    <div class="shot on"><img src="shot-on.png" alt=""><span class="label">On</span></div>
  </div>
</div>
</body>
</html>
